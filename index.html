<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOMBOLA NEWS - REAL NEWS NO FAKE</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#eee;color:#000}
.top{background:#000;color:#fff;padding:8px 12px;display:flex;justify-content:space-between;font-size:13px}
.header{background:#b80000;color:#fff;padding:14px;text-align:center}
.header h1{margin:0;font-size:26px;letter-spacing:1px}
.header p{margin:4px 0 0;font-size:14px}
.nav{display:flex;overflow:auto;background:#111;gap:0}
.nav button{background:#111;color:#fff;border:none;padding:12px 18px;font-weight:bold;white-space:nowrap;border-right:1px solid #222}
.nav button.active{background:#ffcc00;color:#000}
.breaking{background:#ffeb3b;color:#000;padding:10px 12px;font-weight:bold;white-space:nowrap;overflow:hidden;border-bottom:1px solid #000}
.grid{padding:10px;display:flex;flex-direction:column;gap:12px}
.card{background:#fff;border-radius:6px;overflow:hidden;border:1px solid #ccc}
.card img{width:100%;height:220px;object-fit:cover;display:block}
.card .in{padding:10px}
.badge{padding:4px 8px;font-size:11px;font-weight:bold;color:#fff;border-radius:3px;display:inline-block}
.b-world{background:#c00}
.b-congo{background:#0a7a0a}
.b-durban{background:#b80000}
.card h3{font-size:16px;margin:8px 0 4px;line-height:1.2}
.card p{font-size:13px;color:#333;margin:0}
</style>
</head>
<body>
<div class="top"><span><b style="color:gold">LIVE</b> Durban • 16 Sep 2026 09:00</span><span>blackdolph12news@gmail.com</span></div>
<div class="header">
<h1>TOMBOLA NEWS</h1>
<p>REAL NEWS • NO FAKE</p>
</div>
<div class="nav">
<button class="active" onclick="filterNews('all',this)">ALL</button>
<button onclick="filterNews('world',this)">WORLD</button>
<button onclick="filterNews('congo',this)">CONGO</button>
<button onclick="filterNews('durban',this)">DURBAN</button>
<button onclick="filterNews('cinema',this)">CINEMA</button>
<button onclick="filterNews('sport',this)">SPORT</button>
</div>
<div class="breaking">🔴 BREAKING 16 SEP: AI giants create standards body TODAY | Saudi oil $120 | DRC-Rwanda Geneva talks TODAY | ANC IEC decision TODAY</div>
<div class="grid" id="grid"></div>

<script>
let news=[
{cat:'world',badge:'WORLD TODAY',cls:'b-world',img:'https://images.unsplash.com/photo-1677442136019-21780ecad995?w=800',title:'BREAKING TODAY: OpenAI, Google, Anthropic Create AI Standards Body - 16 Sep',desc:'Sept 16: World biggest AI companies to form self-regulatory body to test powerful AI before release. Proposal by Google DeepMind.'},
{cat:'world',badge:'WORLD TODAY',cls:'b-world',img:'https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?w=800',title:'Saudi Cancels Oil Cargoes After Pipeline Hit - Oil $120 Today',desc:'Sept 16: Saudi cut shipments to Europe after drone attacks hit East-West pipeline. Yanbu port suspended. Prices top $120.'},
{cat:'world',badge:'WORLD TODAY',cls:'b-world',img:'https://images.unsplash.com/photo-1521295121783-8a321d551ad2?w=800',title:'Geneva TODAY: DRC-Rwanda Talks Start Sept 16-17',desc:'TODAY in Geneva: Joint Security Mechanism on Washington Accords. US, Qatar, AU mediators present. Fighting in eastern DRC on agenda.'},
{cat:'world',badge:'WORLD',cls:'b-world',img:'https://images.unsplash.com/photo-1515694346937-94d85e41e6f0?w=800',title:'Global Summit 2026: World Leaders Meet on Climate Crisis',desc:'World leaders gather in New York for urgent climate talks as temperatures rise worldwide.'},
{cat:'congo',badge:'CONGO',cls:'b-congo',img:'https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?w=800',title:'Kinshasa: New Business District Opens Near Gombe',desc:'President announces major infrastructure project to create jobs and modernize capital.'},
{cat:'durban',badge:'DURBAN TODAY',cls:'b-durban',img:'https://images.unsplash.com/photo-1571212515416-fef01fc43637?w=800',title:'BREAKING: 282 Durban Refugees Move to Stella Park - 16 Sep',desc:'Home Affairs offered Lindela or reintegration. Group refuses, kids in Durban schools. Second wave threats by Sept 30.'},
{cat:'durban',badge:'SA TODAY',cls:'b-durban',img:'https://images.unsplash.com/photo-1529107386315-e1a2ed48a620?w=800',title:'ANC vs IEC: Judgment TODAY 16 Sep',desc:'Electoral Court decides TODAY if ANC late candidate list will be accepted. Final lists today.'}
];
function showNews(list){
let g=document.getElementById('grid');
g.innerHTML='';
list.forEach(n=>{
g.innerHTML+=`<div class="card"><img src="${n.img}"><div class="in"><span class="badge ${n.cls}">${n.badge}</span><h3>${n.title}</h3><p>${n.desc}</p></div></div>`;
});
}
function filterNews(cat,el){
document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
if(el) el.classList.add('active');
if(cat=='all') showNews(news);
else showNews(news.filter(n=>n.cat==cat));
}
showNews(news);
</script>
</body>
</html>
